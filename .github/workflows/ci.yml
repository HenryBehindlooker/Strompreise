name: CI

on:
  push:
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typprüfung
        run: npm run check

      - name: Unit-Tests
        run: npm run test:unit -- --run

      - name: Playwright-Browser installieren
        run: npx playwright install --with-deps chromium

      - name: E2E-Smoke-Test
        run: npm run test:e2e
